<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>RELIC DEPTHS — Prototype 0.1.2</title><style>*{box-sizing:border-box}body{margin:0;background:#07111c;color:#dce9f3;font-family:system-ui,'Yu Gothic',sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:absolute;left:12px;top:8px;font-size:13px;text-shadow:0 2px 5px #000;pointer-events:none}#msg{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:13px;text-align:center;text-shadow:0 2px 4px #000;pointer-events:none;max-width:70vw}#controls{position:absolute;inset:0;pointer-events:none}button{pointer-events:auto;background:#172e43dd;color:white;border:1px solid #8ea8bb77;border-radius:10px;padding:10px 14px;font-size:15px;touch-action:manipulation}button:active{background:#3c627e}#move{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,51px);gap:4px}#move button{padding:10px 0}#actions{position:absolute;right:12px;bottom:14px;display:flex;gap:7px;align-items:end}#actions button{min-height:46px}#fire{background:#8e3737ee}#aim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;color:#9ee7e0;text-shadow:0 0 5px #001;pointer-events:none}#overlay{position:absolute;inset:0;background:#08121beb;display:flex;align-items:center;justify-content:center;z-index:4;padding:20px}#overlay article{max-width:500px;text-align:center}#overlay p{font-size:13px;line-height:1.8;color:#aebdcb}#overlay button{margin:6px}#timer{position:absolute;top:8px;right:12px;font-weight:bold;color:#ffd47b}#version{position:absolute;right:12px;top:34px;z-index:2;font-size:12px;color:#9fd6ed;background:#07111cbb;padding:3px 7px;border-radius:5px;pointer-events:none}#errorlog{position:absolute;left:12px;top:45px;z-index:6;max-width:85vw;color:#fff;background:#9c2538;padding:6px 9px;border-radius:6px;font-size:12px;display:none;white-space:pre-wrap}#hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:11px;color:#b9c8d5;pointer-events:none;white-space:nowrap}@media (max-height:400px){#hud{font-size:11px}#move{bottom:5px}#actions{bottom:5px}button{font-size:13px;padding:8px}#move{grid-template-columns:repeat(3,43px)}#hint{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="msg"></div><div id="aim">＋</div><div id="timer"></div><div id="version">Ver. 0.1.2</div><div id="errorlog"></div><div id="hint">画面をドラッグして照準調整 ／ ジャイロは許可後に利用可能</div><div id="controls"><div id="move"><span></span><button data-act="forward">▲</button><span></span><button data-act="left">◀</button><button data-act="back">▼</button><button data-act="right">▶</button><button data-act="turnL">↶</button><button data-act="wait">待機</button><button data-act="turnR">↷</button></div><div id="actions"><button id="gyro">ジャイロ</button><button id="reload">装填</button><button id="knife">ナイフ</button><button id="fire">射撃</button></div></div><div id="overlay"><article><h2>RELIC DEPTHS</h2><div style="color:#9fd6ed;font-size:14px;margin-top:-10px">Ver. 0.1.2</div><p>一人称・マス移動・ターン制ダンジョンの試作版。雑魚敵は近接のみ。敵はあなたが1回行動するたびに1マス進み、隣接すると攻撃します。射撃は3秒間、照準を合わせてタップすると発射。射程、反動、遮蔽物を試せます。<br>横画面推奨。これは最初の動作検証版です。</p><button id="start">探索開始</button></article></div><script>
window.addEventListener('error',function(e){var el=document.getElementById('errorlog');if(el){el.style.display='block';el.textContent='起動エラー: '+(e.message||'不明')+' (行 '+(e.lineno||'?')+')';}});
window.addEventListener('unhandledrejection',function(e){var el=document.getElementById('errorlog');if(el){el.style.display='block';el.textContent='処理エラー: '+String(e.reason||'不明');}});
const c=document.getElementById('game'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('msg'),timer=document.getElementById('timer'),overlay=document.getElementById('overlay');let W,H,z=[],depth=[],enemies=[],phase='idle',shotEnd=0,shotCount=0,last=0,gyroOn=false,gyroBase=null,aimX=0,aimY=0,drag=null;const map=['###############','#.....#.......#','#.###.#.###.#.#','#...#...#...#.#','###.#.###.###.#','#...#.....#...#','#.#####.#.#.###','#.......#.....#','#.###.#####.#.#','#...#.......#.#','###.#.#####.#.#','#...#...#...#.#','#.#####.#.###.#','#.............#','###############'];let p={x:1,y:1,dir:0,hp:100,ammo:15,spare:45,loot:0,turn:0};let info='出口に帰還するまで戦利品は確定しません';function reset(){p={x:1,y:1,dir:0,hp:100,ammo:15,spare:45,loot:0,turn:0};enemies=[{x:4,y:1,hp:45},{x:7,y:3,hp:45},{x:11,y:5,hp:45},{x:7,y:9,hp:45},{x:12,y:13,hp:45},{x:3,y:11,hp:45}];phase='idle';aimX=aimY=0;info='敵は近接攻撃のみ。射程と退路を意識しよう';overlay.style.display='none'}function wall(x,y){return !map[Math.floor(y)]||map[Math.floor(y)][Math.floor(x)]==='#'}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function los(a,b){let d=dist(a,b),steps=Math.ceil(d*16);for(let i=1;i<steps;i++){let t=i/steps;if(wall(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))return false}return true}function enemyTurn(){p.turn++;let occupied=new Set();for(let e of enemies){if(e.hp<=0)continue;let d=dist(p,e);if(d<=1.05){p.hp-=Math.max(3,Math.floor(Math.random()*10)+5);info='スクラップ兵の近接攻撃！';continue}let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(q=>!wall(q.x,q.y)&&!(q.x===p.x&&q.y===p.y)&&!enemies.some(f=>f!==e&&f.hp>0&&f.x===q.x&&f.y===q.y)&&!occupied.has(q.x+','+q.y));opts.sort((a,b)=>dist(a,p)-dist(b,p));if(opts.length&&dist(opts[0],p)<d){e.x=opts[0].x;e.y=opts[0].y}occupied.add(e.x+','+e.y)}if(p.hp<=0){phase='dead';overlay.style.display='flex';overlay.querySelector('h2').textContent='EXPLORER LOST';overlay.querySelector('p').textContent='探索者は死亡しました。装備・所持金・身体改造・戦利品はすべて失われました。';document.getElementById('start').textContent='新しい探索者で再挑戦'}}function move(a){if(phase!=='idle')return;if(a==='turnL'){p.dir=(p.dir+3)%4;return}if(a==='turnR'){p.dir=(p.dir+1)%4;return}if(a==='wait'){enemyTurn();return}let dirs=[[1,0],[0,1],[-1,0],[0,-1]],d=dirs[p.dir],dx=0,dy=0;if(a==='forward'){dx=d[0];dy=d[1]}if(a==='back'){dx=-d[0];dy=-d[1]}if(a==='left'){dx=d[1];dy=-d[0]}if(a==='right'){dx=-d[1];dy=d[0]}let nx=p.x+dx,ny=p.y+dy;if(!wall(nx,ny)&&!enemies.some(e=>e.hp>0&&e.x===nx&&e.y===ny)){p.x=nx;p.y=ny;enemyTurn();if(p.x===1&&p.y===1&&p.loot>0){phase='won';overlay.style.display='flex';overlay.querySelector('h2').textContent='帰還成功';overlay.querySelector('p').textContent=`${p.loot} Cr の戦利品を持ち帰りました。試作版なので次の探索は初期状態からです。`;document.getElementById('start').textContent='再探索'}}else info='進めない。別の経路を探そう'}function reload(){if(phase!=='idle'||p.ammo===15||p.spare===0)return;let n=Math.min(15-p.ammo,p.spare);p.ammo+=n;p.spare-=n;info='リロードした';enemyTurn()}function knife(){if(phase!=='idle')return;let target=enemies.filter(e=>e.hp>0&&dist(e,p)<=1.05).sort((a,b)=>dist(a,p)-dist(b,p))[0];if(target){target.hp-=30;info='ナイフで30ダメージ';if(target.hp<=0){p.loot+=200;info='撃破。200 Cr 回収'}}else info='ナイフは届かなかった';enemyTurn()}function startFire(){if(phase!=='idle'||p.ammo<=0)return;phase='shoot';shotEnd=performance.now()+3000;shotCount=0;info='3秒間で照準を合わせて撃て！';}function shot(){if(phase!=='shoot'||p.ammo<=0)return;p.ammo--;shotCount++;let dxy=[[1,0],[0,1],[-1,0],[0,-1]][p.dir];let visible=enemies.filter(e=>e.hp>0&&los(p,e)).map(e=>{let dx=e.x-p.x,dy=e.y-p.y;let forward=dx*dxy[0]+dy*dxy[1],side=-dx*dxy[1]+dy*dxy[0];return {e,forward,side,angle:Math.atan2(side,forward)}}).filter(v=>v.forward>0&&Math.abs(v.angle)<.7).sort((a,b)=>a.forward-b.forward);let target=visible.find(v=>Math.abs(v.angle-aimX)<(.11/(1+v.forward*.08))&&Math.abs(aimY)<.22);if(target){let chance=Math.max(.25,1-(Math.max(0,target.forward-4)*.13));if(Math.random()<chance){target.e.hp-=22;info=`命中！ ${22}ダメージ（距離 ${target.forward.toFixed(1)} マス）`;if(target.e.hp<=0){p.loot+=200;info='撃破！ 200 Cr回収'}}else info='射程減衰で弾が外れた'}else info='射撃は外れた';aimX+=.035+(Math.random()-.5)*.05;aimY+=.035+(Math.random()-.5)*.045}function endFire(){if(phase==='shoot'){phase='idle';enemyTurn()}}function render(now){requestAnimationFrame(render);let pixelRatio=Math.min(window.devicePixelRatio||1,1.5);let desiredW=Math.round(window.innerWidth*pixelRatio),desiredH=Math.round(window.innerHeight*pixelRatio);if(c.width!==desiredW||c.height!==desiredH){c.width=desiredW;c.height=desiredH}W=c.width;H=c.height;ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);let w=window.innerWidth,h=window.innerHeight;let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#07111c');sky.addColorStop(.5,'#243b4c');sky.addColorStop(.51,'#1a2832');sky.addColorStop(1,'#070b10');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);let dir=p.dir*Math.PI/2;let rays=Math.ceil(w/3),strip=w/rays;depth=[];for(let i=0;i<rays;i++){let angle=dir+Math.atan((i/rays-.5)*1.35),rx=Math.cos(angle),ry=Math.sin(angle),t=.02,side=0;while(t<17&&!wall(p.x+rx*t,p.y+ry*t)){t+=.045}let corrected=t*Math.cos(angle-dir),height=Math.min(h*2,h/(corrected*.8));depth[i]=corrected;let bx=p.x+rx*t,by=p.y+ry*t;side=Math.min(bx%1,by%1,1-bx%1,1-by%1);let shade=Math.max(24,140-corrected*15)+(side<.05?8:0);ctx.fillStyle=`rgb(${shade*.52|0},${shade*.73|0},${shade|0})`;ctx.fillRect(i*strip,h/2-height/2,strip+1,height);ctx.fillStyle=`rgba(0,0,0,${Math.min(.5,corrected*.035)})`;ctx.fillRect(i*strip,h/2-height/2,strip+1,height)}let objects=enemies.filter(e=>e.hp>0).map(e=>{let dx=e.x-p.x,dy=e.y-p.y,forward=dx*Math.cos(dir)+dy*Math.sin(dir),side=-dx*Math.sin(dir)+dy*Math.cos(dir);return {e,forward,side}}).filter(o=>o.forward>.2&&Math.abs(o.side/o.forward)<1.2&&los(p,o.e)).sort((a,b)=>b.forward-a.forward);for(let o of objects){let x=w/2+(o.side/o.forward)*w*.73,sz=Math.min(h*1.6,h/(o.forward*.9)),ix=Math.max(0,Math.min(rays-1,Math.floor(x/strip)));if(o.forward>depth[ix]+.35)continue;ctx.fillStyle='#4b5e68';ctx.fillRect(x-sz*.24,h/2-sz*.28,sz*.48,sz*.7);ctx.fillStyle='#758993';ctx.fillRect(x-sz*.17,h/2-sz*.48,sz*.34,sz*.23);ctx.fillStyle='#ee5a54';ctx.fillRect(x-sz*.11,h/2-sz*.4,sz*.22,Math.max(3,sz*.035));ctx.fillStyle='#253e4a';ctx.fillRect(x-sz*.24,h/2+sz*.42,sz*.19,sz*.25);ctx.fillRect(x+sz*.05,h/2+sz*.42,sz*.19,sz*.25);ctx.fillStyle='#ccdbdf';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(`${o.e.hp} HP`,x,h/2-sz*.52)}let ax=w/2+Math.tan(aimX)*w*.73,ay=h/2+aimY*h*.5;document.getElementById('aim').style.left=ax+'px';document.getElementById('aim').style.top=ay+'px';hud.textContent=`HP ${Math.max(0,p.hp)} / 100  |  9mm ${p.ammo}/15  予備 ${p.spare}  |  ${p.loot} Cr  |  TURN ${p.turn}`;msg.textContent=info;if(phase==='shoot'){let rem=Math.max(0,(shotEnd-now)/1000);timer.textContent=`射撃 ${rem.toFixed(1)} 秒`;if(now>=shotEnd)endFire()}else timer.textContent='';if(phase==='shoot'){ctx.fillStyle='#7e8d98';ctx.fillRect(w*.48,h*.78,w*.04,h*.22);ctx.fillStyle='#303f4a';ctx.fillRect(w*.47,h*.88,w*.06,h*.12)}else{ctx.fillStyle='#5d6873';ctx.fillRect(w*.48,h*.85,w*.04,h*.15)}}document.getElementById('start').onclick=reset;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>move(b.dataset.act));document.getElementById('reload').onclick=reload;document.getElementById('knife').onclick=knife;document.getElementById('fire').onclick=()=>phase==='shoot'?shot():startFire();c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};if(phase==='shoot')shot()});c.addEventListener('pointermove',e=>{if(!drag)return;aimX=Math.max(-.65,Math.min(.65,aimX+(e.clientX-drag.x)/window.innerWidth));aimY=Math.max(-.7,Math.min(.7,aimY+(e.clientY-drag.y)/window.innerHeight*2));drag={x:e.clientX,y:e.clientY}});window.addEventListener('pointerup',()=>drag=null);document.getElementById('gyro').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){let r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){info='ジャイロの許可がありません';return}}gyroOn=!gyroOn;gyroBase=null;info=gyroOn?'ジャイロ有効':'ジャイロ無効'}catch(e){info='ジャイロを利用できません。HTTPSで開いてください'}};window.addEventListener('deviceorientation',e=>{if(!gyroOn||e.gamma==null||e.beta==null)return;if(!gyroBase)gyroBase={g:e.gamma,b:e.beta};aimX=Math.max(-.65,Math.min(.65,(e.gamma-gyroBase.g)*.018));aimY=Math.max(-.7,Math.min(.7,(e.beta-gyroBase.b)*.014))});window.addEventListener('keydown',e=>{let a={ArrowUp:'forward',ArrowDown:'back',ArrowLeft:'turnL',ArrowRight:'turnR',a:'left',d:'right',' ':'wait'}[e.key];if(a){e.preventDefault();move(a)}if(e.key==='f'){phase==='shoot'?shot():startFire()}if(e.key==='r')reload()});requestAnimationFrame(render);
</script></body></html>
