<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>RELIC DEPTHS — Prototype 0.2.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:#dce9f3;font-family:system-ui,'Yu Gothic',sans-serif}body{display:flex;justify-content:center}#shell{width:100%;max-width:680px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}#viewport{position:relative;flex:2 1 0;min-height:0;overflow:hidden;background:#08121d}#game{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;left:9px;top:9px;right:8px;font-size:11px;line-height:1.4;text-shadow:0 2px 5px #000;pointer-events:none}#msg{position:absolute;left:7%;right:7%;bottom:14px;font-size:12px;text-align:center;text-shadow:0 2px 4px #000;pointer-events:none}#aim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;color:#9ee7e0;text-shadow:0 0 5px #001;pointer-events:none}#timer{position:absolute;top:40px;right:10px;font-weight:bold;color:#ffd47b}#version{position:absolute;right:8px;top:7px;z-index:2;font-size:11px;color:#9fd6ed;background:#07111cbb;padding:3px 6px;border-radius:5px;pointer-events:none}#errorlog{position:absolute;left:8px;top:64px;z-index:6;max-width:90%;color:#fff;background:#9c2538;padding:6px 9px;border-radius:6px;font-size:12px;display:none;white-space:pre-wrap}#panel{flex:1 1 0;min-height:0;background:linear-gradient(#142b3e,#0b1827);border-top:2px solid #3a596b;display:flex;flex-direction:column;padding:8px 10px max(9px,env(safe-area-inset-bottom));gap:6px}#panelhead{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9db8c9}#controls{flex:1;min-height:0;display:flex;gap:10px}button{background:#203a50;color:white;border:1px solid #7e9fb477;border-radius:9px;padding:7px;font-size:14px;touch-action:manipulation;min-width:0}button:active{background:#426a83}#move{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px;min-width:0}#move button{font-size:17px;padding:2px}#actions{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:5px;min-width:0}#fire{background:#973c41}#recenter{background:#385b6d}#shootHelp{display:none;color:#e7c77c;font-size:11px;text-align:center}#overlay{position:fixed;inset:0;background:#08121bf5;display:flex;align-items:center;justify-content:center;z-index:4;padding:20px}#overlay article{max-width:450px;text-align:center}#overlay p{font-size:13px;line-height:1.8;color:#aebdcb}#overlay button{margin:6px;padding:12px 18px}#hint{font-size:10px;color:#b9c8d5;text-align:center}#diagnostic{font-size:10px;color:#a8d7ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-height:650px){#panel{padding-top:5px;gap:3px}#panelhead,#hint{font-size:9px}button{font-size:12px}#move button{font-size:14px}}@media(orientation:landscape){#viewport{flex:3}#panel{flex:2}}</style></head><body><div id="shell"><div id="viewport"><canvas id="game"></canvas><div id="hud"></div><div id="msg"></div><div id="aim">＋</div><div id="timer"></div><div id="version">Ver. 0.2.1</div><div id="errorlog"></div></div><div id="panel"><div id="panelhead"><span>RELIC DEPTHS / FLOOR B1</span><span id="mode">探索モード</span></div><div id="controls"><div id="move"><button data-act="turnL">↶</button><button data-act="forward">▲</button><button data-act="turnR">↷</button><button data-act="left">◀</button><button data-act="wait">待機</button><button data-act="right">▶</button><span></span><button data-act="back">▼</button><span></span></div><div id="actions"><button id="gyro">ジャイロ</button><button id="reload">装填</button><button id="knife">ナイフ</button><button id="fire">射撃</button><button id="recenter">中心補正</button><button id="diagnose">診断 OFF</button></div></div><div id="shootHelp">手前に傾けると照準が上 ／ 3秒以内に射撃</div><div id="diagnostic"></div><div id="hint">赤いコアへの命中は一撃必殺</div></div></div><div id="overlay"><article><h2>RELIC DEPTHS</h2><div style="color:#9fd6ed;font-size:14px;margin-top:-10px">Ver. 0.2.1</div><p>縦画面・一人称ターン制ダンジョン。上部が探索画面、下部が操作パネルです。射撃ボタンで3秒間の照準フェーズに入り、もう一度押すと発射。赤いコアを狙えば一撃必殺。ジャイロは射撃開始時に中心を合わせます。センサー診断と中心補正も利用できます。</p><button id="start">探索開始</button></article></div><script>
window.addEventListener('error',function(e){var el=document.getElementById('errorlog');if(el){el.style.display='block';el.textContent='起動エラー: '+(e.message||'不明')+' (行 '+(e.lineno||'?')+')';}});

const c=document.getElementById('game'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('msg'),timer=document.getElementById('timer'),overlay=document.getElementById('overlay');let gyroReading=null,gyroFilteredX=0,gyroFilteredY=0,gyroSensitivity=0.012;let viewH=1;let W,H,z=[],depth=[],enemies=[],phase='idle',shotEnd=0,shotCount=0,last=0,gyroOn=false,gyroBase=null,aimX=0,aimY=0,drag=null;const map=['###############','#.....#.......#','#.###.#.###.#.#','#...#...#...#.#','###.#.###.###.#','#...#.....#...#','#.#####.#.#.###','#.......#.....#','#.###.#####.#.#','#...#.......#.#','###.#.#####.#.#','#...#...#...#.#','#.#####.#.###.#','#.............#','###############'];let p={x:1,y:1,dir:0,hp:100,ammo:15,spare:45,loot:0,turn:0};let info='出口に帰還するまで戦利品は確定しません';function reset(){p={x:1,y:1,dir:0,hp:100,ammo:15,spare:45,loot:0,turn:0};enemies=[{x:4,y:1,hp:45},{x:7,y:3,hp:45},{x:11,y:5,hp:45},{x:7,y:9,hp:45},{x:12,y:13,hp:45},{x:3,y:11,hp:45}];phase='idle';aimX=aimY=0;document.getElementById('mode').textContent='探索モード';document.getElementById('shootHelp').style.display='none';info='敵は近接攻撃のみ。射程と退路を意識しよう';overlay.style.display='none'}function wall(x,y){return !map[Math.floor(y)]||map[Math.floor(y)][Math.floor(x)]==='#'}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function los(a,b){let d=dist(a,b),steps=Math.ceil(d*16);for(let i=1;i<steps;i++){let t=i/steps;if(wall(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))return false}return true}function enemyTurn(){p.turn++;let occupied=new Set();for(let e of enemies){if(e.hp<=0)continue;let d=dist(p,e);if(d<=1.05){p.hp-=Math.max(3,Math.floor(Math.random()*10)+5);info='スクラップ兵の近接攻撃！';continue}let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(q=>!wall(q.x,q.y)&&!(q.x===p.x&&q.y===p.y)&&!enemies.some(f=>f!==e&&f.hp>0&&f.x===q.x&&f.y===q.y)&&!occupied.has(q.x+','+q.y));opts.sort((a,b)=>dist(a,p)-dist(b,p));if(opts.length&&dist(opts[0],p)<d){e.x=opts[0].x;e.y=opts[0].y}occupied.add(e.x+','+e.y)}if(p.hp<=0){phase='dead';overlay.style.display='flex';overlay.querySelector('h2').textContent='EXPLORER LOST';overlay.querySelector('p').textContent='探索者は死亡しました。装備・所持金・身体改造・戦利品はすべて失われました。';document.getElementById('start').textContent='新しい探索者で再挑戦'}}function move(a){if(phase!=='idle')return;if(a==='turnL'){p.dir=(p.dir+3)%4;return}if(a==='turnR'){p.dir=(p.dir+1)%4;return}if(a==='wait'){enemyTurn();return}let dirs=[[1,0],[0,1],[-1,0],[0,-1]],d=dirs[p.dir],dx=0,dy=0;if(a==='forward'){dx=d[0];dy=d[1]}if(a==='back'){dx=-d[0];dy=-d[1]}if(a==='left'){dx=d[1];dy=-d[0]}if(a==='right'){dx=-d[1];dy=d[0]}let nx=p.x+dx,ny=p.y+dy;if(!wall(nx,ny)&&!enemies.some(e=>e.hp>0&&e.x===nx&&e.y===ny)){p.x=nx;p.y=ny;enemyTurn();if(p.x===1&&p.y===1&&p.loot>0){phase='won';overlay.style.display='flex';overlay.querySelector('h2').textContent='帰還成功';overlay.querySelector('p').textContent=`${p.loot} Cr の戦利品を持ち帰りました。試作版なので次の探索は初期状態からです。`;document.getElementById('start').textContent='再探索'}}else info='進めない。別の経路を探そう'}function reload(){if(phase!=='idle'||p.ammo===15||p.spare===0)return;let n=Math.min(15-p.ammo,p.spare);p.ammo+=n;p.spare-=n;info='リロードした';enemyTurn()}function knife(){if(phase!=='idle')return;let target=enemies.filter(e=>e.hp>0&&dist(e,p)<=1.05).sort((a,b)=>dist(a,p)-dist(b,p))[0];if(target){target.hp-=30;info='ナイフで30ダメージ';if(target.hp<=0){p.loot+=200;info='撃破。200 Cr 回収'}}else info='ナイフは届かなかった';enemyTurn()}function startFire(){if(phase!=='idle'||p.ammo<=0)return;phase='shoot';shotEnd=performance.now()+3000;shotCount=0;info='3秒間で弱点（赤いコア）を狙え！';aimX=aimY=0;gyroBase=null;gyroFilteredX=gyroFilteredY=0;document.getElementById('mode').textContent='射撃モード';document.getElementById('shootHelp').style.display='block';}function shot(){if(phase!=='shoot'||p.ammo<=0)return;p.ammo--;shotCount++;let dxy=[[1,0],[0,1],[-1,0],[0,-1]][p.dir];let visible=enemies.filter(e=>e.hp>0&&los(p,e)).map(e=>{let dx=e.x-p.x,dy=e.y-p.y;let forward=dx*dxy[0]+dy*dxy[1],side=-dx*dxy[1]+dy*dxy[0];return {e,forward,side,angle:Math.atan2(side,forward)}}).filter(v=>v.forward>0&&Math.abs(v.angle)<.7).sort((a,b)=>a.forward-b.forward);let target=visible.find(v=>Math.abs(v.angle-aimX)<(.11/(1+v.forward*.08))&&Math.abs(aimY)<.75);if(target){let weakY=-.8*Math.min(viewH*1.6,viewH/(target.forward*.9))/viewH;let weakTolerance=Math.max(.045,.085/(Math.max(1,target.forward)*.55));let weak=Math.abs(target.angle-aimX)<(.055/(1+target.forward*.06))&&Math.abs(aimY-weakY)<weakTolerance;let chance=Math.max(.25,1-(Math.max(0,target.forward-4)*.13));if(weak){target.e.hp=0;p.loot+=200;info='弱点貫通！ 一撃撃破 +200 Cr';}else if(Math.random()<chance){target.e.hp-=22;info=`命中！ 22ダメージ（距離 ${target.forward.toFixed(1)} マス）`;if(target.e.hp<=0){p.loot+=200;info='撃破！ 200 Cr回収'}}else info='射程減衰で弾が外れた'}else info='射撃は外れた';aimX+=.035+(Math.random()-.5)*.05;aimY+=.035+(Math.random()-.5)*.045}function endFire(){if(phase==='shoot'){phase='idle';document.getElementById('mode').textContent='探索モード';document.getElementById('shootHelp').style.display='none';enemyTurn()}}function render(now){requestAnimationFrame(render);let pixelRatio=Math.min(window.devicePixelRatio||1,1.5);let desiredW=Math.round(c.clientWidth*pixelRatio),desiredH=Math.round(c.clientHeight*pixelRatio);if(c.width!==desiredW||c.height!==desiredH){c.width=desiredW;c.height=desiredH}W=c.width;H=c.height;viewH=c.clientHeight;ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);let w=c.clientWidth,h=c.clientHeight;let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#07111c');sky.addColorStop(.5,'#243b4c');sky.addColorStop(.51,'#1a2832');sky.addColorStop(1,'#070b10');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);let dir=p.dir*Math.PI/2;const cameraX=p.x+.5,cameraY=p.y+.5;let rays=Math.ceil(w/3),strip=w/rays;depth=[];for(let i=0;i<rays;i++){let angle=dir+Math.atan((i/rays-.5)*1.35),rx=Math.cos(angle),ry=Math.sin(angle),t=.02,side=0;while(t<17&&!wall(cameraX+rx*t,cameraY+ry*t)){t+=.045}let corrected=t*Math.cos(angle-dir),height=Math.min(h*2,h/(corrected*.8));depth[i]=corrected;let bx=cameraX+rx*t,by=cameraY+ry*t;side=Math.min(bx%1,by%1,1-bx%1,1-by%1);let shade=Math.max(24,140-corrected*15)+(side<.05?8:0);ctx.fillStyle=`rgb(${shade*.52|0},${shade*.73|0},${shade|0})`;ctx.fillRect(i*strip,h/2-height/2,strip+1,height);ctx.fillStyle=`rgba(0,0,0,${Math.min(.5,corrected*.035)})`;ctx.fillRect(i*strip,h/2-height/2,strip+1,height)}let objects=enemies.filter(e=>e.hp>0).map(e=>{let dx=(e.x+.5)-cameraX,dy=(e.y+.5)-cameraY,forward=dx*Math.cos(dir)+dy*Math.sin(dir),side=-dx*Math.sin(dir)+dy*Math.cos(dir);return {e,forward,side}}).filter(o=>o.forward>.2&&Math.abs(o.side/o.forward)<1.2&&los(p,o.e)).sort((a,b)=>b.forward-a.forward);for(let o of objects){let x=w/2+(o.side/o.forward)*w*.73,sz=Math.min(h*1.6,h/(o.forward*.9)),ix=Math.max(0,Math.min(rays-1,Math.floor(x/strip)));if(o.forward>depth[ix]+.35)continue;ctx.fillStyle='#4b5e68';ctx.fillRect(x-sz*.24,h/2-sz*.28,sz*.48,sz*.7);ctx.fillStyle='#758993';ctx.fillRect(x-sz*.17,h/2-sz*.48,sz*.34,sz*.23);ctx.fillStyle='#ee5a54';ctx.fillRect(x-sz*.11,h/2-sz*.4,sz*.22,Math.max(3,sz*.035));ctx.fillStyle='#253e4a';ctx.fillRect(x-sz*.24,h/2+sz*.42,sz*.19,sz*.25);ctx.fillRect(x+sz*.05,h/2+sz*.42,sz*.19,sz*.25);ctx.fillStyle='#ccdbdf';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(`${o.e.hp} HP`,x,h/2-sz*.52)}let ax=w/2+Math.tan(aimX)*w*.73,ay=h/2+aimY*h*.5;document.getElementById('aim').style.left=ax+'px';document.getElementById('aim').style.top=ay+'px';hud.textContent=`HP ${Math.max(0,p.hp)} / 100  |  9mm ${p.ammo}/15  予備 ${p.spare}  |  ${p.loot} Cr  |  TURN ${p.turn}`;msg.textContent=info;if(phase==='shoot'){let rem=Math.max(0,(shotEnd-now)/1000);timer.textContent=`射撃 ${rem.toFixed(1)} 秒`;if(now>=shotEnd)endFire()}else timer.textContent='';if(phase==='shoot'){ctx.fillStyle='#7e8d98';ctx.fillRect(w*.48,h*.78,w*.04,h*.22);ctx.fillStyle='#303f4a';ctx.fillRect(w*.47,h*.88,w*.06,h*.12)}else{ctx.fillStyle='#5d6873';ctx.fillRect(w*.48,h*.85,w*.04,h*.15)}}document.getElementById('start').onclick=reset;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>move(b.dataset.act));document.getElementById('reload').onclick=reload;document.getElementById('knife').onclick=knife;document.getElementById('fire').onclick=()=>phase==='shoot'?shot():startFire();c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};if(phase==='shoot')shot()});c.addEventListener('pointermove',e=>{if(!drag)return;aimX=Math.max(-.65,Math.min(.65,aimX+(e.clientX-drag.x)/c.clientWidth));aimY=Math.max(-.7,Math.min(.7,aimY+(e.clientY-drag.y)/c.clientHeight*2));drag={x:e.clientX,y:e.clientY}});window.addEventListener('pointerup',()=>drag=null);document.getElementById('gyro').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){let r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){info='ジャイロの許可がありません';return}}gyroOn=!gyroOn;gyroBase=null;info=gyroOn?'ジャイロ有効。射撃開始時に中心を再設定':'ジャイロ無効'}catch(e){info='ジャイロを利用できません。HTTPSで開いてください'}};let lastSensor=null,diagOn=false,gyroLastTime=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const angleDiff=(v,b)=>((v-b+540)%360)-180;function recenter(){aimX=aimY=gyroFilteredX=gyroFilteredY=0;gyroBase=null;lastSensor=null;info='現在の向きを照準中央に設定';}document.getElementById('recenter').onclick=recenter;document.getElementById('diagnose').onclick=()=>{diagOn=!diagOn;document.getElementById('diagnose').textContent=diagOn?'診断 ON':'診断 OFF';if(!diagOn)document.getElementById('diagnostic').textContent='';};window.addEventListener('deviceorientation',e=>{if(e.beta==null||e.gamma==null)return;const raw={beta:e.beta,gamma:e.gamma,alpha:e.alpha};if(diagOn)document.getElementById('diagnostic').textContent=`β ${e.beta.toFixed(1)}° γ ${e.gamma.toFixed(1)}° α ${e.alpha==null?'--':e.alpha.toFixed(1)}° / 照準 ${aimX.toFixed(2)},${aimY.toFixed(2)}`;if(!gyroOn||phase!=='shoot')return;const t=performance.now();if(!gyroBase){gyroBase={...raw};lastSensor={...raw};gyroLastTime=t;gyroFilteredX=gyroFilteredY=0;aimX=aimY=0;return;}const db=angleDiff(raw.beta,lastSensor.beta),dg=angleDiff(raw.gamma,lastSensor.gamma);const dt=Math.max(0.016,Math.min(.2,(t-gyroLastTime)/1000));gyroLastTime=t;lastSensor={...raw};if(Math.abs(db)>Math.max(18,dt*260)||Math.abs(dg)>Math.max(18,dt*260))return;let dx=angleDiff(raw.gamma,gyroBase.gamma),dy=angleDiff(raw.beta,gyroBase.beta);if(Math.abs(dx)>80||Math.abs(dy)>80)return;const tx=clamp(dx*.012,-.65,.65),ty=clamp(-dy*.012,-.7,.7);gyroFilteredX+=.18*(tx-gyroFilteredX);gyroFilteredY+=.18*(ty-gyroFilteredY);aimX=gyroFilteredX;aimY=gyroFilteredY;});window.addEventListener('keydown',e=>{let a={ArrowUp:'forward',ArrowDown:'back',ArrowLeft:'turnL',ArrowRight:'turnR',a:'left',d:'right',' ':'wait'}[e.key];if(a){e.preventDefault();move(a)}if(e.key==='f'){phase==='shoot'?shot():startFire()}if(e.key==='r')reload()});requestAnimationFrame(render);
</script></body></html>
