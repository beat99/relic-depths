const $=id=>document.getElementById(id);window.addEventListener('error',e=>{$('error').style.display='block';$('error').textContent='エラー: '+e.message+' / '+e.lineno});window.addEventListener('unhandledrejection',e=>{$('error').style.display='block';$('error').textContent='処理エラー: '+String(e.reason)});
const canvas=$('game'),ctx=canvas.getContext('2d'),mc=$('mapcanvas'),mctx=mc.getContext('2d');const N=31,PI=Math.PI,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let maze,seen,visited,exit,items,dogs,p,phase='menu',info='',gyroOn=false,gyroBase=null,gyroFilteredX=0,gyroFilteredY=0,aimX=0,aimY=0,shotEnd=0,shotRecoil=0,flashEnd=0,diag=false,lastRaw=null,drag=null,shotCount=0,recoilX=0,recoilY=0;let audio=null;const dirs=[[1,0],[0,1],[-1,0],[0,-1]];
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}function makeMaze(){const r=rng(30021),m=Array.from({length:N},()=>Array(N).fill('#'));const stack=[[1,1]];m[1][1]='.';while(stack.length){let [x,y]=stack[stack.length-1],opts=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>x+dx>0&&x+dx<N-1&&y+dy>0&&y+dy<N-1&&m[y+dy][x+dx]==='#');if(!opts.length){stack.pop();continue}let [dx,dy]=opts[Math.floor(r()*opts.length)];m[y+dy/2][x+dx/2]='.';m[y+dy][x+dx]='.';stack.push([x+dx,y+dy])}for(let k=0;k<36;k++){let x=2+Math.floor(r()*(N-4)),y=2+Math.floor(r()*(N-4));if(m[y][x]==='#'&&((m[y-1][x]==='.'&&m[y+1][x]==='.')||(m[y][x-1]==='.'&&m[y][x+1]==='.')))m[y][x]='.'}for(let k=0;k<10;k++){let x=3+Math.floor(r()*(N-7)),y=3+Math.floor(r()*(N-7));if(m[y][x]==='.'&&m[y][x+1]==='.'&&m[y+1][x]==='.'&&m[y+1][x+1]==='.')continue; if(m[y][x]==='.'&&m[y][x+2]==='.'&&m[y+2][x]==='.'&&m[y+2][x+2]==='.')for(let dy=0;dy<3;dy++)for(let dx=0;dx<3;dx++)m[y+dy][x+dx]='.'}return m}
function bfs(x,y){let q=[[x,y]],d=Array.from({length:N},()=>Array(N).fill(-1));d[y][x]=0;for(let i=0;i<q.length;i++){let [cx,cy]=q[i];for(let [dx,dy] of dirs){let nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&maze[ny][nx]!== '#'&&d[ny][nx]<0){d[ny][nx]=d[cy][cx]+1;q.push([nx,ny])}}}return d}
function reset(){maze=makeMaze();seen=Array.from({length:N},()=>Array(N).fill(false));visited=Array.from({length:N},()=>Array(N).fill(false));let d=bfs(1,1),far=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(d[y][x]>0)far.push({x,y,d:d[y][x]});far.sort((a,b)=>b.d-a.d);exit={x:far[0].x,y:far[0].y};const r=rng(10122);let candidates=far.filter(o=>o.d>7&&o.d<far[0].d-3&&!(o.x===exit.x&&o.y===exit.y));dogs=[];items=[];for(let i=0;i<12&&candidates.length;i++){let ix=Math.floor(r()*candidates.length),v=candidates.splice(ix,1)[0];dogs.push({x:v.x,y:v.y,hp:44,alert:false,pose:0})}for(let i=0;i<16&&candidates.length;i++){let ix=Math.floor(r()*candidates.length),v=candidates.splice(ix,1)[0];items.push({x:v.x,y:v.y,value:120+Math.floor(r()*5)*80})}p={x:1,y:1,dir:0,hp:100,ammo:12,spare:36,loot:0,turn:0};phase='idle';aimX=aimY=shotRecoil=recoilX=recoilY=0;gyroBase=null;markSeen();$('overlay').style.display='none';$('maplayer').style.display='none';$('mode').textContent='探索モード';$('aim').style.display='none';info='暗闇の奥から、何かの唸り声が聞こえる…';try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){audio=null}}
function wall(x,y){return x<0||y<0||x>=N||y>=N||maze[Math.floor(y)][Math.floor(x)]==='#'}function distance(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function line(a,b){let ax=a.x+.5,ay=a.y+.5,bx=b.x+.5,by=b.y+.5,steps=Math.ceil(Math.hypot(bx-ax,by-ay)*20);for(let i=1;i<steps;i++){let t=i/steps;if(wall(ax+(bx-ax)*t,ay+(by-ay)*t))return false}return true}function markSeen(){visited[p.y][p.x]=true;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){let x=p.x+dx,y=p.y+dy;if(x>=0&&y>=0&&x<N&&y<N&&Math.abs(dx)+Math.abs(dy)<=3&&line(p,{x,y}))seen[y][x]=true}}

function lose(){phase='dead';$('overlay').style.display='flex';$('overlay').querySelector('h1').textContent='EXPLORER LOST';$('overlaytext').textContent='探索者は死亡した。遺物・弾薬・身体改造はすべて失われた。遺跡の地図も闇に消えた。';$('start').textContent='新しい探索者で再挑戦';sound(65,.7,'sawtooth',.1)}function win(){phase='won';$('overlay').style.display='flex';$('overlay').querySelector('h1').textContent='生還';$('overlaytext').textContent=`${p.loot} Cr相当の遺物を持ち帰った。今回の試作では次の探索は初期状態から始まる。`; $('start').textContent='もう一度探索';sound(480,.35,'sine',.08)}
function enemyTurn(){p.turn++;let noise=false;for(let e of dogs){if(e.hp<=0)continue;let d=distance(e,p);if(d<=1){let damage=6+Math.floor(Math.random()*9);p.hp-=damage;info=`猟犬の噛みつき！ ${damage}ダメージ`;sound(95,.16);continue}if(d<7&&line(e,p))e.alert=true;if(!e.alert)continue;let opts=dirs.map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(q=>!wall(q.x,q.y)&&!(q.x===p.x&&q.y===p.y)&&!dogs.some(o=>o!==e&&o.hp>0&&o.x===q.x&&o.y===q.y));opts.sort((a,b)=>distance(a,p)-distance(b,p));if(opts.length&&distance(opts[0],p)<d){e.x=opts[0].x;e.y=opts[0].y;e.pose++}if(distance(e,p)<5)noise=true}if(noise&&p.hp>0&&Math.random()<.36){info='近くで低い唸り声が響く…';sound(90,.22,'triangle',.035)}if(p.hp<=0)lose()}
function move(act){if(phase!=='idle'||$('maplayer').style.display==='flex')return;if(act==='turnL'){p.dir=(p.dir+3)%4;enemyTurn();markSeen();return}if(act==='turnR'){p.dir=(p.dir+1)%4;enemyTurn();markSeen();return}if(act==='wait'){enemyTurn();return}let [fx,fy]=dirs[p.dir],dx=0,dy=0;if(act==='forward'){dx=fx;dy=fy}else if(act==='back'){dx=-fx;dy=-fy}else if(act==='left'){dx=fy;dy=-fx}else if(act==='right'){dx=-fy;dy=fx}let nx=p.x+dx,ny=p.y+dy;if(wall(nx,ny)||dogs.some(e=>e.hp>0&&e.x===nx&&e.y===ny)){info='進めない。石壁か何かが道を塞いでいる';return}p.x=nx;p.y=ny;markSeen();let item=items.find(i=>i.x===nx&&i.y===ny);if(item){p.loot+=item.value;items.splice(items.indexOf(item),1);info=`古代遺物を回収 +${item.value} Cr`;sound(650,.16,'sine',.045)}else info='石床を踏む足音が響く';if(nx===exit.x&&ny===exit.y){info='青白く光る石門。入口へ帰れば遺物を持ち帰れる';sound(420,.35,'sine',.04)}if(nx===1&&ny===1&&p.turn>0){win();return}enemyTurn()}
